<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Firtaza | Inspirasi & Tips Hijab Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { beige: '#F4F0EA', gray: '#E8E8E8', rose: '#D2BBA0', dark: '#4A423D', light: '#FAFAFA' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light text-brand-dark antialiased flex flex-col min-h-screen">

    <div id="shared-header"></div>

    <main class="flex-grow pt-28 pb-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-14">
                <span class="uppercase tracking-widest text-xs font-semibold text-brand-rose block mb-2">Blog Firtaza</span>
                <h1 class="text-3xl sm:text-4xl font-serif text-brand-dark mb-4">Inspirasi & Tips Hijab Harian</h1>
                <div class="w-12 h-0.5 bg-brand-rose/50 mx-auto"></div>
            </div>

            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10"></div>
        </div>
    </main>

    <!-- Modal Baca Artikel Penuh -->
    <div id="article-modal" class="fixed inset-0 bg-black/50 z-[80] hidden flex items-center justify-center p-4" onclick="if(event.target === this) document.getElementById('article-modal').classList.add('hidden')">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-8 max-h-[85vh] overflow-y-auto relative shadow-2xl">
            <button onclick="document.getElementById('article-modal').classList.add('hidden')" class="absolute top-6 right-6 text-gray-400 hover:text-brand-dark">
                <i class="fas fa-times text-lg"></i>
            </button>
            <span id="modal-blog-cat" class="text-[10px] uppercase tracking-widest font-bold text-brand-rose"></span>
            <h2 id="modal-blog-title" class="font-serif text-2xl sm:text-3xl text-brand-dark mt-2 mb-6"></h2>
            <div id="modal-blog-content" class="text-sm text-gray-600 font-light leading-relaxed space-y-4"></div>
            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center">
                <a href="katalog.html" class="bg-brand-dark text-white px-6 py-2.5 rounded-full text-xs uppercase tracking-widest">Lihat Produk Terkait</a>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <script src="app.js"></script>
    <script>
        initSharedLayout("blog");

        const ARTICLES = [
            {
                cat: "Panduan Gaya",
                title: "Alasan Hijab Bahan Katun Cocok untuk Cuaca Tropis Makassar",
                excerpt: "Memilih bahan hijab yang menyerap keringat seperti Niraya Cotton membuat aktivitas dari pagi hingga sore tetap segar.",
                image: "images/artikel1.jpg",
                content: `<p>Beraktivitas di kota dengan cuaca hangat seperti Makassar menuntut kita lebih selektif memilih material hijab. Serat katun alami pada <strong>Niraya Cotton (Rp 37.000)</strong> memiliki sirkulasi udara yang sangat baik sehingga tidak menimbulkan rasa gerah.</p><p>Selain sejuk di kulit, tekstur katun juga mudah tegak di dahi tanpa perlu disetrika berulang kali, sehingga menjadi pilihan praktis untuk mahasiswa maupun pekerja kantoran.</p>`
            },
            {
                cat: "Tips Harian",
                title: "Rahasia Pakai Ciput Seharian Tanpa Pusing & Telinga Sakit",
                excerpt: "Banyak wanita menghindari inner hijab karena terlalu ketat. Simak cara memilih dan merawat ciput agar nyaman seharian.",
                image: "images/Afizah Ciput1.jpg",
                content: `<p>Kunci tampilan hijab yang rapi sepanjang hari terletak pada pemilihan inner atau ciput. <strong>Afizah Ciput (Rp 23.000)</strong> dirancang dengan material airflow dan tali pengatur agar mengikuti bentuk kepala tanpa menekan area telinga.</p><p>Agar ciput lebih awet dan tidak cepat melar, cucilah secara lembut menggunakan tangan dan hindari menjemur di bawah terik matahari langsung.</p>`
            },
            {
                cat: "Padu Padan Warna",
                title: "Padu Padan Warna Lembut dengan Seri Ufya Elora",
                excerpt: "Warna Espresso, Ash Grey, hingga Dusty Blush selalu berhasil memberikan kesan wajah lebih cerah dan tampilan yang berkelas.",
                image: "images/Ufya Elora1.jpeg",
                content: `<p>Palet warna lembut adalah investasi terbaik di lemari pakaian Anda. Seri <strong>Ufya Elora (Rp 63.000)</strong> hadir dengan bahan yang jatuh elegan untuk melengkapi kemeja putih, abaya, maupun blazer kerja.</p><p>Padukan dengan riasan natural untuk menonjolkan kesan anggun di acara formal maupun aktivitas harian.</p>`
            }
        ];

        const grid = document.getElementById("blog-grid");
        grid.innerHTML = ARTICLES.map((a, idx) => `
            <article class="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm hover:shadow-lg transition-all flex flex-col">
                <img src="${a.image}" alt="${a.title}" class="w-full h-60 object-cover object-center">
                <div class="p-6 flex flex-col flex-grow">
                    <span class="text-[10px] uppercase tracking-widest text-brand-rose font-bold mb-2">${a.cat}</span>
                    <h3 class="font-serif text-xl text-brand-dark mb-3">${a.title}</h3>
                    <p class="text-xs text-gray-500 font-light leading-relaxed mb-6">${a.excerpt}</p>
                    <button onclick="openArticle(${idx})" class="mt-auto text-left text-xs uppercase tracking-widest font-semibold text-brand-dark hover:text-brand-rose">
                        Baca Selengkapnya <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </article>
        `).join("");

        function openArticle(index) {
            const a = ARTICLES[index];
            document.getElementById("modal-blog-cat").textContent = a.cat;
            document.getElementById("modal-blog-title").textContent = a.title;
            document.getElementById("modal-blog-content").innerHTML = a.content;
            document.getElementById("article-modal").classList.remove("hidden");
        }
    </script>
</body>
</html>
